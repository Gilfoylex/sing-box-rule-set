name: Update sing-box rules

on:
  push:
    branches:
      - main
  schedule:
    # 每周一 UTC 00:00，即北京时间周一 08:00。
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-release-rules
  cancel-in-progress: false

jobs:
  update-rules:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      SING_BOX_VERSION: '1.14.3'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate JSON rules
        run: node index.js

      - name: Install sing-box
        shell: bash
        run: |
          set -euo pipefail
          archive="sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "$RUNNER_TEMP"
          echo "${RUNNER_TEMP}/sing-box-${SING_BOX_VERSION}-linux-amd64" >> "$GITHUB_PATH"

      - name: Compile SRS rules
        shell: bash
        run: |
          set -euo pipefail
          sing-box version
          sing-box rule-set compile --output direct-site.srs direct-site.json
          sing-box rule-set compile --output proxy-site.srs proxy-site.json
          for file in direct-site.json proxy-site.json direct-site.srs proxy-site.srs; do
            test -s "$file"
          done

      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release
          path: release

      - name: Update release branch
        shell: bash
        run: |
          set -euo pipefail
          cp direct-site.json proxy-site.json direct-site.srs proxy-site.srs release/
          cd release
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add direct-site.json proxy-site.json direct-site.srs proxy-site.srs
          if git diff --cached --quiet; then
            echo '规则没有变化，无需提交。'
            exit 0
          fi
          git commit -m 'chore: update sing-box rules'
          git push origin HEAD:release
